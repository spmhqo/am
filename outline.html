    <style>
        :root {
            --bg-color: #faf9f6;
            --surface-color: #ffffff;
            --border-color: #e2dfdc;
            --border-focus: #706b63;
            --text-main: #2c2a29;
            --text-muted: #6e6963;
            --accent: #1a1918;
            --accent-hover: #383532;
            --success: #2e7d32;
            --header-color: #4338ca;
            --font-serif: 'Newsreader', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .document-container {
            max-width: 760px;
            margin: 0 auto;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
        }

        /* Header Styles */
        .doc-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 30px;
        }

        .doc-title {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--header-color);
            margin-bottom: 8px;
        }

        .doc-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Section Layout */
        .section-heading {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
            margin: 36px 0 16px 0;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }

        /* Output Box Styling */
        .output-card {
            margin-bottom: 30px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .output-title {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .prompt-preview {
            width: 100%;
            min-height: 200px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.5;
            resize: vertical;
            white-space: pre-wrap;
            margin-bottom: 16px;
        }

        .copy-btn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .copy-btn:hover {
            background: var(--accent-hover);
        }

        .copy-btn.copied {
            background: var(--success);
        }

        /* Footer */
        .doc-footer {
            text-align: center;
            margin-top: 50px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            body {
                padding: 12px 8px;
            }
            .document-container {
                padding: 24px 16px;
            }
            .doc-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

                <textarea id="prompt1" class="prompt-preview" readonly>Please outline the content based on the reader's-journey you have provided in the previous response. 
Reader-faced version-এ লেখো।

READER DEMAND & CONCRETE ANSWER FILTER — MANDATORY

Content তৈরি করার সময় Topic-কে কেন্দ্র করে সাধারণ, logically complete বা textbook-style content তৈরি করবেন না। প্রথমে নির্ধারণ করুন reader এই content থেকে বাস্তবে কী জানতে, বুঝতে, সিদ্ধান্ত নিতে বা করতে চান।

Reader-এর real demand এবং সেই demand পূরণের জন্য প্রয়োজনীয় concrete information-কে content-এর primary organising principle হিসেবে ব্যবহার করুন।

METHOD

Content তৈরি করার আগে এই sequence অনুসরণ করুন:

1. Identify the Reader’s Real Demand 
Reader Topic সম্পর্কে সাধারণভাবে কী জানতে পারেন—তা নয়; তিনি কেন এই information খুঁজছেন এবং শেষ পর্যন্ত কী answer/knowledge/result চান তা নির্ধারণ করুন।

2. Convert the Demand into Specific Questions  
Reader-এর real demand-কে কয়েকটি নির্দিষ্ট প্রশ্নে ভেঙে নিন।  
প্রতিটি প্রশ্ন এমন হতে হবে যার একটি meaningful answer দেওয়া সম্ভব।

3. Identify the Required Knowledge  
প্রতিটি reader question-এর উত্তর দিতে reader-এর ঠিক কোন information জানা প্রয়োজন তা নির্ধারণ করুন।

4. Identify the Concrete Facts  
Required knowledge-এর মধ্যে কোন কোন specific fact, number, condition, criterion, distinction, example, evidence, step, rule, limitation, comparison বা decision-point reader-এর জানা প্রয়োজন তা নির্ধারণ করুন।

5. Build the Content Around Those Answers  
তারপর content/outline তৈরি করুন।  
প্রতিটি section, subsection এবং গুরুত্বপূর্ণ paragraph-কে অন্তত একটি identified reader question-এর উত্তর দিতে হবে।

6. Apply the Relevance Gate  
প্রতিটি planned point-এর ক্ষেত্রে পরীক্ষা করুন:

> “এটি reader-এর কোন specific demand বা question পূরণ করছে?”

যদি কোনও point-এর clear answer না থাকে, সেটি বাদ দিন—even if it is generally relevant, interesting, logically correct, or traditionally included in content on this topic.

7. Apply the Concrete Answer Gate  
প্রতিটি গুরুত্বপূর্ণ reader question-এর ক্ষেত্রে পরীক্ষা করুন:

> “Reader এই অংশটি পড়ার পরে ঠিক কোন concrete answer/fact নিয়ে বেরোবেন?”

যদি উত্তরটি অস্পষ্ট, generic বা purely explanatory হয়, তাহলে আরও নির্দিষ্ট করুন।

8. Apply the Completeness of Demand Test  
শেষে পরীক্ষা করুন:

> “Reader যে কারণে এই content-এ এসেছেন, সেই মূল demand কি সম্পূর্ণভাবে satisfy হয়েছে?”

Topic সম্পর্কে আরও অনেক কথা বলা বাকি থাকলেও, reader-এর actual demand পূরণ হয়ে গেলে অপ্রয়োজনীয় information যোগ করবেন না।

NON-NEGOTIABLE RULES

- Topic is not the same as Re
- Logical completeness is not the same as reader usefulness.
- Generic explanation cannot substitute for a concrete answer.
- Reader-এর real demand-এর সঙ্গে সরাসরি সম্পর্ক নেই এমন information শুধু content-কে comprehensive করার জন্য যোগ করবেন না।
- সম্ভব হলে abstract statement-এর পরিবর্তে specific facts, criteria, examples, conditions, comparisons, numbers, steps বা decision-rules দিন।
- কোনও section রাখার আগে তার underlying reader question identify করুন।
- কোনও important reader question unanswered রেখে content complete বলে ধরে নেবেন না।
- Content-এর structure Topic-এর conventional structure অনুসরণ করবে না; Reader-এর information journey অনুসরণ করবে।
- Structure must serve the reader’s demand, not the other way around.

FINAL QUALITY CHECK

Content finalise করার আগে এই চারটি প্রশ্নের উত্তর দিন:

1. What does the reader actually want?
​2. What does the reader need to know to get that answer?
3. What concrete facts will satisfy that need?
4. Does every major part of the content contribute directly to satisfying that demand?

যদি কোনও major section-এর ক্ষেত্রে ১–৩ নম্বরের উত্তর পরিষ্কারভাবে দেওয়া না যায়, সেই section revise বা remove করুন।

RULE (MANDATORY)
Content Type: Question-Driven Actuality Unfolding through Reasoning, in the conversational mode of “One-to-One Intellectual Conversation”
Content should not give the conclusion directly; it should unfold questions and force the reader to the next question.  
reader journey-কে content-এর architecture হওয়া উচিত, content-এর substitute নয়。</textarea>

    <script>
        // Copy functionality with visual feedback
        function copyPrompt(elementId, btn) {
            const outputBox = document.getElementById(elementId);

            outputBox.select();
            outputBox.setSelectionRange(0, 99999);

            try {
                document.execCommand('copy');
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                btn.classList.add('copied');

                window.getSelection().removeAllRanges();

                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy text: ', err);
            }
        }
    </script>
